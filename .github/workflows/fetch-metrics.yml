name: Fetch Content Metrics

on:
  schedule:
    # Every Monday at 08:00 UTC
    - cron: "0 8 * * 1"
  workflow_dispatch: # allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Brevo metrics
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          python3 - "$NOW" "$BREVO_API_KEY" <<'PYEOF'
          import sys, json, urllib.request

          now = sys.argv[1]
          api_key = sys.argv[2]

          def brevo(path):
              req = urllib.request.Request(
                  f"https://api.brevo.com/v3{path}",
                  headers={'api-key': api_key, 'Accept': 'application/json'}
              )
              with urllib.request.urlopen(req) as resp:
                  return json.loads(resp.read())

          with open('data/automated.json') as f:
              data = json.load(f)

          # Campaign count
          try:
              r = brevo('/emailCampaigns?limit=1')
              data['brevo']['email_campaigns'] = r.get('count')
              print(f"Campaign count: {data['brevo']['email_campaigns']}")
          except Exception as e:
              print(f"Campaign count error: {e}")

          # Subscriber count
          try:
              r = brevo('/contacts?limit=1')
              data['brevo']['subscriber_count'] = r.get('count')
              print(f"Subscriber count: {data['brevo']['subscriber_count']}")
          except Exception as e:
              print(f"Subscriber count error: {e}")

          # Paginate all sent campaigns (50 per page)
          all_campaigns = []
          limit = 50
          offset = 0
          try:
              while True:
                  r = brevo(f'/emailCampaigns?status=sent&limit={limit}&offset={offset}')
                  batch = r.get('campaigns', [])
                  all_campaigns.extend(batch)
                  print(f"Fetched {len(batch)} campaigns at offset {offset} (total: {len(all_campaigns)})")
                  if len(batch) < limit:
                      break
                  offset += limit
          except Exception as e:
              print(f"Campaign list error: {e}")

          # Sort newest first
          all_campaigns.sort(key=lambda c: c.get('sentDate', ''), reverse=True)

          # Fetch individual stats for each campaign
          recent = []
          total_delivered = 0
          total_opens = 0
          total_clicks = 0

          for c in all_campaigns:
              try:
                  detail = brevo(f"/emailCampaigns/{c['id']}")
                  stats = detail.get('statistics', {}).get('globalStats', {})
              except Exception as e:
                  print(f"Stats error for campaign {c['id']}: {e}")
                  stats = {}
              delivered = stats.get('delivered', 0) or 0
              opens = stats.get('uniqueViews', 0) or 0
              clicks = stats.get('uniqueClicks', 0) or 0
              sent_count = stats.get('sent', 0) or 0
              hard_bounces = stats.get('hardBounces', 0) or 0
              soft_bounces = stats.get('softBounces', 0) or 0
              unsubscriptions = stats.get('unsubscriptions', 0) or 0
              complaints = stats.get('complaints', 0) or 0
              open_rate = round(stats['opensRate'], 1) if stats.get('opensRate') is not None else (round(opens / delivered * 100, 1) if delivered > 0 else None)
              click_rate = round(clicks / delivered * 100, 1) if delivered > 0 else None
              recent.append({
                  'id': c.get('id'),
                  'name': c.get('name', ''),
                  'subject': c.get('subject', ''),
                  'sent_date': c.get('sentDate', '')[:10] if c.get('sentDate') else '',
                  'sent': sent_count,
                  'delivered': delivered,
                  'unique_opens': opens,
                  'unique_clicks': clicks,
                  'open_rate': open_rate,
                  'click_rate': click_rate,
                  'hard_bounces': hard_bounces,
                  'soft_bounces': soft_bounces,
                  'unsubscriptions': unsubscriptions,
                  'complaints': complaints,
              })
              total_delivered += delivered
              total_opens += opens
              total_clicks += clicks

          data['brevo']['recent_campaigns'] = recent
          data['brevo']['avg_open_rate'] = round(total_opens / total_delivered * 100, 1) if total_delivered > 0 else None
          data['brevo']['avg_click_rate'] = round(total_clicks / total_delivered * 100, 1) if total_delivered > 0 else None
          data['last_updated'] = now

          with open('data/automated.json', 'w') as f:
              json.dump(data, f, indent=2)
          PYEOF

      - name: Append to history
        run: |
          python3 - <<'EOF'
          import json
          from datetime import date

          with open('data/automated.json') as f:
              auto = json.load(f)
          with open('data/manual.json') as f:
              manual = json.load(f)
          with open('data/history.json') as f:
              history = json.load(f)

          week = str(date.today())
          entry = {
              "week": week,
              "brevo_email_campaigns": auto.get("brevo", {}).get("email_campaigns"),
              "brevo_subscriber_count": auto.get("brevo", {}).get("subscriber_count"),
              "brevo_avg_open_rate": auto.get("brevo", {}).get("avg_open_rate"),
              "brevo_avg_click_rate": auto.get("brevo", {}).get("avg_click_rate"),
              "linkedin_followers": manual.get("linkedin", {}).get("followers"),
          }

          # replace existing entry for this week if re-run
          history = [h for h in history if h.get("week") != week]
          history.append(entry)
          history.sort(key=lambda h: h["week"])

          with open('data/history.json', 'w') as f:
              json.dump(history, f, indent=2)
          EOF

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/automated.json data/history.json
          git diff --cached --quiet || (git commit -m "chore: weekly metrics update $(date -u +%Y-%m-%d)" && git push)
