name: Fetch Content Metrics

on:
  schedule:
    # Every Monday at 08:00 UTC
    - cron: "0 8 * * 1"
  workflow_dispatch: # allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Brevo metrics
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          # Fetch total campaign count
          curl -s \
            -H "api-key: $BREVO_API_KEY" \
            -H "Accept: application/json" \
            "https://api.brevo.com/v3/emailCampaigns?limit=1" \
            > /tmp/brevo_campaigns.json
          echo "Campaigns response:"; cat /tmp/brevo_campaigns.json

          # Fetch subscriber count
          curl -s \
            -H "api-key: $BREVO_API_KEY" \
            -H "Accept: application/json" \
            "https://api.brevo.com/v3/contacts?limit=1" \
            > /tmp/brevo_contacts.json
          echo "Contacts response:"; cat /tmp/brevo_contacts.json

          # Fetch last 20 sent campaigns (basic info for IDs/names/dates)
          curl -s \
            -H "api-key: $BREVO_API_KEY" \
            -H "Accept: application/json" \
            "https://api.brevo.com/v3/emailCampaigns?status=sent&limit=20" \
            > /tmp/brevo_sent.json
          echo "Sent campaigns response:"; cat /tmp/brevo_sent.json

          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          python3 - "$NOW" "$BREVO_API_KEY" <<'PYEOF'
          import sys, json, urllib.request

          now = sys.argv[1]
          api_key = sys.argv[2]

          with open('data/automated.json') as f:
              data = json.load(f)

          try:
              campaigns_data = json.load(open('/tmp/brevo_campaigns.json'))
              data['brevo']['email_campaigns'] = campaigns_data.get('count')
          except Exception as e:
              print(f"campaigns parse error: {e}")

          try:
              contacts_data = json.load(open('/tmp/brevo_contacts.json'))
              data['brevo']['subscriber_count'] = contacts_data.get('count')
          except Exception as e:
              print(f"contacts parse error: {e}")

          try:
              sent_data = json.load(open('/tmp/brevo_sent.json'))
              campaigns = sent_data.get('campaigns', [])
              campaigns.sort(key=lambda c: c.get('sentDate', ''), reverse=True)
              campaigns = campaigns[:10]
              recent = []
              total_delivered = 0
              total_opens = 0
              total_clicks = 0
              for c in campaigns:
                  # Fetch individual campaign for full globalStats
                  try:
                      req = urllib.request.Request(
                          f"https://api.brevo.com/v3/emailCampaigns/{c['id']}",
                          headers={'api-key': api_key, 'Accept': 'application/json'}
                      )
                      with urllib.request.urlopen(req) as resp:
                          detail = json.loads(resp.read())
                      stats = detail.get('statistics', {}).get('globalStats', {})
                  except Exception as e:
                      print(f"Error fetching campaign {c['id']}: {e}")
                      stats = {}
                  delivered = stats.get('delivered', 0) or 0
                  opens = stats.get('uniqueViews', 0) or 0
                  clicks = stats.get('uniqueClicks', 0) or 0
                  sent_count = stats.get('sent', 0) or 0
                  open_rate = round(stats['opensRate'], 1) if stats.get('opensRate') is not None else (round(opens / delivered * 100, 1) if delivered > 0 else None)
                  click_rate = round(clicks / delivered * 100, 1) if delivered > 0 else None
                  recent.append({
                      'id': c.get('id'),
                      'name': c.get('name', ''),
                      'subject': c.get('subject', ''),
                      'sent_date': c.get('sentDate', '')[:10] if c.get('sentDate') else '',
                      'sent': sent_count,
                      'delivered': delivered,
                      'unique_opens': opens,
                      'unique_clicks': clicks,
                      'open_rate': open_rate,
                      'click_rate': click_rate,
                  })
                  total_delivered += delivered
                  total_opens += opens
                  total_clicks += clicks
              data['brevo']['recent_campaigns'] = recent
              data['brevo']['avg_open_rate'] = round(total_opens / total_delivered * 100, 1) if total_delivered > 0 else None
              data['brevo']['avg_click_rate'] = round(total_clicks / total_delivered * 100, 1) if total_delivered > 0 else None
          except Exception as e:
              print(f"sent campaigns parse error: {e}")

          data['last_updated'] = now

          with open('data/automated.json', 'w') as f:
              json.dump(data, f, indent=2)
          PYEOF

      - name: Append to history
        run: |
          python3 - <<'EOF'
          import json
          from datetime import date

          with open('data/automated.json') as f:
              auto = json.load(f)
          with open('data/manual.json') as f:
              manual = json.load(f)
          with open('data/history.json') as f:
              history = json.load(f)

          week = str(date.today())
          entry = {
              "week": week,
              "brevo_email_campaigns": auto.get("brevo", {}).get("email_campaigns"),
              "brevo_subscriber_count": auto.get("brevo", {}).get("subscriber_count"),
              "brevo_avg_open_rate": auto.get("brevo", {}).get("avg_open_rate"),
              "brevo_avg_click_rate": auto.get("brevo", {}).get("avg_click_rate"),
              "linkedin_followers": manual.get("linkedin", {}).get("followers"),
          }

          # replace existing entry for this week if re-run
          history = [h for h in history if h.get("week") != week]
          history.append(entry)
          history.sort(key=lambda h: h["week"])

          with open('data/history.json', 'w') as f:
              json.dump(history, f, indent=2)
          EOF

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/automated.json data/history.json
          git diff --cached --quiet || (git commit -m "chore: weekly metrics update $(date -u +%Y-%m-%d)" && git push)
